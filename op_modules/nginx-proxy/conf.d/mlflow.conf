# The CP template's iframe src="/controlpanel/modelsmanager" has no handler in the
# Spring controller (only /show, /ajax-api/**, /api/**, /get-artifact/** are mapped).
# Redirect that exact URL to the working MLflow UI at /mlflow/ so the iframe loads.
location = /controlpanel/modelsmanager {
    return 302 /mlflow/;
}

location /mlflow/ {
    proxy_pass http://mlops-manager:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
}
