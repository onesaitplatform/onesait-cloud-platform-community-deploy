version: "2.1"

services:
  keycloak-manager:
    container_name: keycloak-manager
    image: ${REPOSITORY}/onesaitplatform/keycloak-manager:${MODULE_TAG}
    environment:
     - SERVER_NAME=${SERVER_NAME}
     - PLATFORM_ADMIN_APIKEY=${PLATFORM_ADMIN_APIKEY}
    stdin_open: true
    external_links:
     - configdb
     - keycloak
     - controlpanelservice
    networks:
    - op_data_datanetwork
networks:
  op_data_datanetwork:
    external: true