version: "2.1"

services:
  monitoringuiservice:
    container_name: monitoringuiservice
    image: ${REPOSITORY}/onesaitplatform/monitoringui:${MODULE_TAG}
    environment:
     - SERVER_NAME=${SERVER_NAME}
     - REALTIMEDBUSEAUTH=false
     - USE_KEYCLOAK=true
     - OAUTH_SSO_ENABLED=true
     - ADMIN_API_KEY=${ADMIN_API_KEY}
    stdin_open: true
    external_links:
     - realtimedb
    networks:
    - op_data_datanetwork
networks:
  op_data_datanetwork:
    external: true
